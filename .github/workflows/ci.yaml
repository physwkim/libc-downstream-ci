name: CI
permissions: {}

on:
  schedule:
    # Run this job daily
    - cron: "0 8 * * *"
  # Allow starting this job manually
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true
  LIBC_CI: 1
  LIBC_CI_ZBUILD_STD: 1
  RUSTDOCFLAGS: -Dwarnings
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: full

jobs:
  test:
    name: Test
    strategy:
      # The latest nightly fails early, which would otherwise cancel the other job
      fail-fast: false
      matrix:
        include:
          - target: armv7-rtems-eabihf
            toolchain: nightly
          # Later nightlies' std does not build for RTEMS (rust-lang/rust#164719,
          # rust-lang/libc#5655), so this one keeps the libc tests running.
          - target: armv7-rtems-eabihf
            toolchain: nightly-2026-10-19
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # The tests run on top of the image from `toolchain.yaml`
      packages: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # Check out this repository to `$GITHUB_WORKSPACE/downstream` for any needed files
      - uses: actions/checkout@v7
        with:
          path: downstream
      # Check out libc to `$GITHUB_WORKSPACE/rust-libc`
      - uses: actions/checkout@v7
        with:
          repository: rust-lang/libc
          # Not `libc-0.2`: its ctest cannot expand macros with `-Zbuild-std`.
          ref: main
          path: rust-libc

      - name: Apply patches
        run: |
          set -eux
          git config --global user.name "GHA Runner"
          git config --global user.email "none@github.com"
          git -C rust-libc am "$GITHUB_WORKSPACE"/downstream/patches/*.patch

      # Tier 3: there is no `rustup target`, std is built with `-Zbuild-std`.
      - name: Setup Rust toolchain
        run: cd rust-libc && ./ci/install-rust.sh
        env:
          TARGET: ""
          TOOLCHAIN: ${{ matrix.toolchain }}
          INSTALL_RUST_SRC: 1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run in Docker
        run: cd rust-libc && ./ci/run-docker.sh ${{ matrix.target }}
